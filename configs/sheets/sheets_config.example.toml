# Copy this file to sheets_config.toml and fill in your values.

# The local spreadsheet to sync, as a path to an `.xlsx` workbook. The workbook
# (and the `sheet_name` tab inside it) is created automatically on the first
# `--sync` push. Relative paths are resolved against this file's directory
# (`configs/sheets/`). Open it in Excel/LibreOffice to edit papers and run
# `arxivscraper --sync` to pull those edits back into the mdfiles.
spreadsheet_path = "papers.xlsx"

# Name of the worksheet (tab) that holds the paper rows.
sheet_name = "Papers"

# Sync direction when `arxivscraper --sync` is run: "push", "pull", or "bidirectional".
sync_mode = "bidirectional"
